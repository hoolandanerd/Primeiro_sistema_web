<!DOCTYPE HTML>
<html lang="pt-BR">
    <head>
        <meta charset="pt-BR">
        <meta name="viewport" content="width=device-width initial-scale=1.0">
        <title>Perfil</title>
        <link rel="stylesheet" href="/Primeiro sistema web/css/perfil.css">
        <link rel="stylesheet" href="/Primeiro sistema web/css/imagem.css">
    </head>
<body>
    <div class="conteudo">
        <main>
            <section>
                <h1>Por favor Preencha esses campos</h1>
            </section>
            <section>
                <form action="salvar_cadastro.text" method="post">
                    <label for="name">Nome:</label>
                    <input type="text" id="nome" name="nome"><br><br>
                    <label for="sobrenome">Sobre Nome:</label>
                    <input type="text" id="sobrenome" name="sobrenome"><br><br>
                    <label for="nascimento">Data de Nascimento:</label>
                    <input type="date" id="nascimento" name="nascimento"><br><br>
                    <label for="cpf">CPF:</label>
                    <input type="number" id="cpf" name="cpf"><br><br>
                    <label for="telefone">telefone</label>
                    <input type="tel" name="telefone" id="telefone"><br><br>
                    <label for="email">Email:</label>
                    <input type="email" name="email" id="email"><br><br>
                    <label for="senha">Senha:</label>
                    <input type="password" name="senha" id="senha"><br><br>
                    <label for="confirmarsenha">Confirme a senha:</label>
                    <input type="password" id="confirmarsenha" name="confirmarsenha"><br><br>
                    <button>Cadastrar</button><br><br>
                </form>
            </section>
        </main>
        <aside>
            <img class="foto" src="/Primeiro sistema web/imagens/perfil.png" alt="adiconar foto perfil">
            <h2> joão Marcolino da Silva Pereira</h2>

        </aside>
    </div>
</body>
</html>
