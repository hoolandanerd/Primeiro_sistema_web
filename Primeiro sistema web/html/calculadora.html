<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calculadora online</title>
        <link rel="stylesheet" href="/Primeiro sistema web/css/calculadora.css">
    </head>
<body>
    <header>
        <h1>Calculadora</h1>
    </header>
    <main>
        <table border="5">
            <caption>Cacalculadora de imc</caption>
            <thead>
                <tr>
                    <th colspan="4"></th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th>7</th>
                    <th>8</th>
                    <th>9</th>
                    <th>/</th>
                </tr>
                <tr>
                    <th>4</th>
                    <th>5</th>
                    <th>6</th>
                    <th>x</th>
                </tr>
                <tr>
                    <th>1</th>
                    <th>2</th>
                    <th>3</th>
                    <th>-</th>
                </tr>
                <tr>
                    <th>0</th>
                    <th>.</th>
                    <th>+</th>
                    <th style="background-color: rgb(255, 109, 5);">=</th>
                </tr>
            </tbody>
            
        </table>
    </main>

</body>
</html>
